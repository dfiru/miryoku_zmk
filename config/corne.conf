# https://github.com/manna-harbour/miryoku
#
# dfiru Corne MK1 - nice!nano v2, wireless split.
# Left half is the central (it talks to the host); right half is the peripheral.
#
# Kconfig has no inline comments. A '#' after a value becomes part of the value
# and the whole assignment is silently discarded, so every comment here is on a
# line of its own.

CONFIG_ZMK_KEYBOARD_NAME="dfiru Corne MK1"


## ---------------------------------------------------------------------------
## Debounce - this is the fix for one keypress registering two or three times
## ---------------------------------------------------------------------------
## ZMK defaults to 5ms press / 5ms release. Raising RELEASE is the chatter fix
## and costs no perceived latency. Do NOT raise PRESS to chase this: press
## debounce adds real input latency, and it makes an already-marginal switch
## (see: B) miss even more often. Leave press at the default.
##
## 20ms release still permits 50 taps per second on one key, well past human
## speed. If chatter survives this, try 25 then 30. If it is clearly gone, you
## can walk back down to 12 for a touch more snap.
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=20


## ---------------------------------------------------------------------------
## Display
## ---------------------------------------------------------------------------
## Every widget defaults to n, and the battery percentage option additionally
## depends on the battery widget, which depends on battery reporting. Setting
## only SHOW_PERCENTAGE (as this file used to) is rejected at build time and
## the percentage never appears. All four have to be named.
##
## Only the battery widget is safe to set for both halves. The layer and
## output widgets are central-only and the peripheral widget is
## peripheral-only, so those live in corne_left.conf and corne_right.conf.
## ZMK applies the shared file and the per-side file, in that order.
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y


## ---------------------------------------------------------------------------
## Power - deep sleep was never switched on, so the board idled 24/7
## ---------------------------------------------------------------------------
## Without CONFIG_ZMK_SLEEP the board never drops below idle draw, so it bleeds
## the cell continuously and is flat whenever you pick it up. A sagging cell is
## itself a cause of missed and repeated keys, so this belongs in the same fix
## as the debounce change above.
##
## 30s of inactivity blanks the display and slows the BLE interval.
## 30min of inactivity drops to deep sleep and microamp draw.
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000


## ---------------------------------------------------------------------------
## RGB underglow, and the OLED that shares its power rail
## ---------------------------------------------------------------------------
## CONFIG_WS2812_STRIP used to be here and has been removed: Zephyr 4.1 split
## it into per-transport symbols (WS2812_STRIP_SPI and friends) which are
## selected from devicetree, so the old name is now an undefined symbol and
## fails the build. The Corne shield already declares the strip and points
## zmk,underglow at it, so CONFIG_ZMK_RGB_UNDERGLOW is all that is needed.
##
## EXT_POWER stays n, deliberately, and this is a correction. Setting it to y
## lets ZMK cut the VCC rail when underglow is off, which reclaims the strip's
## quiescent draw. But on this board the OLED hangs off that same rail, so
## cutting it blanks the screen. A dark display is a worse trade than the
## milliamps, and the real battery win is CONFIG_ZMK_SLEEP above, which powers
## everything down properly rather than shaving a rail while awake.
##
## AUTO_OFF_USB is gone for the same reason: it would have cut the rail, and so
## the screen, every time the board ran on battery.
##
## The strip comes up lit at 10% brightness, by preference. AUTO_OFF_IDLE
## still drops it after 30s of inactivity and brings it back when you touch a
## key, so it costs nothing while you are away from the desk.
##
## Toggle from the MEDIA layer: hold left outer thumb (Esc) and tap P.
## Brightness is O, hue U, saturation I, effect Y.
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=10


## ---------------------------------------------------------------------------
## Pointing / mouse keys - a regression the rebase introduced
## ---------------------------------------------------------------------------
## Mouse support moved into ZMK proper and is now gated behind ZMK_POINTING,
## which defaults to n. Without it the firmware registers no Mouse HID
## interface at all and miryoku's whole MOUSE layer is dead. The old firmware
## did present a Mouse device, so this was a silent regression rather than a
## missing feature.
CONFIG_ZMK_POINTING=y
