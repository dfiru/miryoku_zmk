# dfiru Corne MK1 - nice!nano v2, wireless split.
# Left half is the central (it talks to the host); right half is the peripheral.

CONFIG_ZMK_KEYBOARD_NAME="dfiru Corne MK1"


## ---------------------------------------------------------------------------
## Debounce - this is the fix for one keypress registering two or three times
## ---------------------------------------------------------------------------
## ZMK defaults to 5ms press / 5ms release. Raising RELEASE is the chatter fix
## and costs no perceived latency. Do NOT raise PRESS to chase this: press
## debounce adds real input latency, and it makes an already-marginal switch
## (see: B) miss even more often. Leave press at the default.
##
## 20ms release still permits 50 taps per second on one key, well past human
## speed. If chatter survives this, try 25 then 30. If it is clearly gone,
## you can walk back down to 12 for a touch more snap.
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=20


## ---------------------------------------------------------------------------
## Display
## ---------------------------------------------------------------------------
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y


## ---------------------------------------------------------------------------
## Power - deep sleep was never switched on, so the board idled 24/7
## ---------------------------------------------------------------------------
## Without CONFIG_ZMK_SLEEP the board never drops below idle draw, so it bleeds
## the cell continuously and is flat whenever you pick it up. A sagging cell is
## itself a cause of missed and repeated keys, so this belongs in the same fix
## as the debounce change above.
CONFIG_ZMK_IDLE_TIMEOUT=30000          # 30s -> blank display, slow the BLE interval
CONFIG_ZMK_SLEEP=y                     # permit real deep sleep
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000  # 30min -> deep sleep, microamp draw


## ---------------------------------------------------------------------------
## RGB underglow
## ---------------------------------------------------------------------------
## The WS2812 strip is the largest single drain on a wireless Corne. Twenty-odd
## LEDs pull tens of milliamps, which flattens a 110mAh cell in an afternoon.
## Underglow stays compiled in but no longer starts lit: toggle it from the
## MEDIA layer (left outer thumb, top-right key) when you want it, and ZMK
## syncs the toggle across both halves so they never disagree.
##
## EXT_POWER=y lets ZMK cut the VCC rail when underglow is off, which is what
## actually reclaims the power. Note the coupling: on an OLED Corne the OLED
## shares that rail and goes dark with the LEDs. A nice!view is on SPI and is
## unaffected. If you want an OLED lit at all times, set EXT_POWER=n and accept
## the drain.
CONFIG_WS2812_STRIP=y
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=y
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=10
# CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=2
