#
# Left half only. This is the central: it holds the link to the host, so the
# widgets that report host-facing state belong here and nowhere else. Setting
# either of these in the shared corne.conf fails the right half's build,
# because their Kconfig dependencies are not satisfiable on a peripheral.
#
# LAYER_STATUS earns its place on a ten layer keymap: it puts the active
# layer's display-name on the screen, so Nav, Num, Sym and Fun stop being
# something you have to hold and guess at.

CONFIG_ZMK_WIDGET_LAYER_STATUS=y
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y
