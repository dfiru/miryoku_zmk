name: 'Building @dfiru'
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      # Zephyr 4.1 renamed boards. This was nice_nano_v2, which no longer
      # exists and fails with "Invalid BOARD". The bare name nice_nano is also
      # wrong: it resolves to the plain Zephyr board without ZMK's variant, so
      # you silently lose CONFIG_ZMK_BLE and the shield's underglow node. The
      # variant has to be named. Revision 2.0.0 is the default and is the
      # board you have. See https://zmk.dev/blog/2025/12/09/zephyr-4-1
      board: '["nice_nano//zmk"]'
      shield: '["corne_left","corne_right","settings_reset"]'

      # Alphas for the BASE layer (layer 0), the one you type on.
      alphas: '["qwerty"]'

      # Alphas for the TAP layer (layer 2), the plain no-hold-tap escape hatch.
      # This is a SEPARATE option from `alphas` above and it defaults to
      # colemak-dh, not to whatever `alphas` is set to. Leaving it unset is why
      # the TAP layer used to type Colemak-DH while BASE typed QWERTY.
      tap: '["qwerty"]'

      nav: '["vi"]'
      clipboard: '["mac"]'

      # `extra` (layer 1) is left at its default, which is qwerty-with-home-row-mods
      # and therefore identical to BASE here. Set it to a layout you want to
      # practise if you ever want layer 1 to be good for something.
      # extra: '["colemakdh"]'

      # custom_config: '["#define MIRYOKU_KLUDGE_GLOBALSHIFTFUNCTIONS"]'
